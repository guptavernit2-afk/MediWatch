name: Verify MediWatch

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      DEMO_MODE: 'true'
      MEDIWATCH_DB_PATH: /tmp/mediwatch-ci.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Run backend regression tests
        run: python -m pytest -q
      - name: Check Python source
        run: python -m compileall -q app.py mediwatch
      - name: Check frontend JavaScript
        run: npm run check
      - name: Run frontend regression tests
        run: npm test

  browser:
    name: Chromium workflow tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install application and browser test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: npm run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  storage-windows:
    name: Windows storage tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify Windows backup and restore behavior
        run: python -m pytest -q tests/test_storage.py
